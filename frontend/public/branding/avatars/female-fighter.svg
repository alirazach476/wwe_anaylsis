<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Woman wrestler">
  <defs>
    <linearGradient id="fStage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1424"/>
      <stop offset="55%" stop-color="#120a14"/>
      <stop offset="100%" stop-color="#1c1018"/>
    </linearGradient>
    <linearGradient id="fSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3c9ab"/>
      <stop offset="100%" stop-color="#d4a07a"/>
    </linearGradient>
    <linearGradient id="fGear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b2148"/>
      <stop offset="100%" stop-color="#1a0c18"/>
    </linearGradient>
    <linearGradient id="fHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2034"/>
      <stop offset="100%" stop-color="#160810"/>
    </linearGradient>
    <radialGradient id="fGlow" cx="50%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="260" fill="url(#fStage)"/>
  <ellipse cx="100" cy="66" rx="90" ry="68" fill="url(#fGlow)"/>
  <!-- long hair silhouette -->
  <path fill="url(#fHair)" d="M48 72 C42 18 158 18 152 72 C162 118 168 178 156 222 C142 176 138 124 134 92 C122 38 78 38 66 92 C62 124 58 176 44 222 C32 178 38 118 48 72 Z"/>
  <!-- athletic shoulders -->
  <path fill="url(#fGear)" d="M38 134 C52 110 74 102 100 102 C126 102 148 110 162 134 L156 168 C138 154 120 148 100 148 C80 148 62 154 44 168 Z"/>
  <!-- torso -->
  <path fill="url(#fGear)" d="M54 142 C60 190 72 228 100 244 C128 228 140 190 146 142 C130 150 114 154 100 154 C86 154 70 150 54 142 Z"/>
  <!-- pink gear stripe -->
  <path d="M72 158 H128" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 172 H122" stroke="#f9a8d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- arms -->
  <path fill="url(#fSkin)" d="M40 136 C26 154 24 190 32 218 C44 212 50 186 52 160 Z"/>
  <path fill="url(#fSkin)" d="M160 136 C174 154 176 190 168 218 C156 212 150 186 148 160 Z"/>
  <!-- neck -->
  <rect x="88" y="98" width="24" height="30" rx="8" fill="url(#fSkin)"/>
  <!-- head -->
  <ellipse cx="100" cy="70" rx="30" ry="38" fill="url(#fSkin)"/>
  <!-- fringe -->
  <path fill="#2e1524" d="M70 58 C74 30 126 30 130 58 C118 44 82 44 70 58 Z"/>
  <path fill="#4a2034" d="M72 56 C84 46 116 46 128 56 C116 50 84 50 72 56 Z"/>
  <!-- eyes + lashes hint -->
  <rect x="84" y="68" width="12" height="3.2" rx="1.6" fill="#1f120c"/>
  <rect x="104" y="68" width="12" height="3.2" rx="1.6" fill="#1f120c"/>
  <path d="M84 66.5 Q90 64 96 66.5" stroke="#1f120c" stroke-width="1.2" fill="none"/>
  <path d="M104 66.5 Q110 64 116 66.5" stroke="#1f120c" stroke-width="1.2" fill="none"/>
  <!-- lips -->
  <path d="M93 88 Q100 94 107 88" stroke="#c45d7a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="86" cy="78" r="4" fill="#e89aaa" opacity="0.5"/>
  <circle cx="114" cy="78" r="4" fill="#e89aaa" opacity="0.5"/>
  <!-- belt -->
  <rect x="68" y="224" width="64" height="10" rx="3" fill="#f472b6"/>
  <rect x="90" y="222" width="20" height="14" rx="3" fill="#fce7f3"/>
  <!-- WOMAN mark -->
  <rect x="58" y="8" width="84" height="20" rx="6" fill="#db2777"/>
  <text x="100" y="22" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="11" font-weight="800" fill="#fff" letter-spacing="1.5">WOMAN</text>
</svg>
