# Expandable event-series registry for WWE major events (PPV / PLE / eligible specials).
# Newly discovered historical series should be added here; collectors consult this file.
# Matching is case-insensitive substring / regex against normalized event names.

meta:
  version: 1
  notes: >
    Registry drives series assignment and coverage audits. It does not invent events.
    Exclusion rules in eligibility.yaml remove weekly TV, NXT TakeOver, house shows.

